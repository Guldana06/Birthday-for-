<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Днем Рождения, жеңге!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            /* Реалистичный фон: глубокий ночной оттенок с мягким свечением */
            background: radial-gradient(circle at center, #3d1a2c 0%, #1a0b14 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        canvas { display: block; }

        #nav-panel {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 20; 
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            font-size: 16px; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-btn:hover { background: rgba(255, 105, 180, 0.4); border-color: #ff69b4; }

        #popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Мягкое затемнение */
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
        }
        #popup-content {
            background: #ffffff; 
            padding: 40px; border-radius: 25px;
            max-width: 450px; text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        #popup-content h2 { color: #883355; margin-bottom: 15px; font-weight: 600; }
        #popup-content p { color: #444; line-height: 1.6; font-size: 17px; }
        #popup-content img { 
            max-width: 220px; border-radius: 20px; margin-bottom: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="threejs-container"></div>

    <div id="nav-panel">
        <button class="nav-btn" id="prev-btn">⬅ Назад</button>
        <button class="nav-btn" id="next-btn">Вперед ➡</button>
    </div>

    <div id="popup-overlay">
        <div id="popup-content">
            <img id="popup-photo" src="" alt="Фото">
            <h2 id="popup-title"></h2>
            <p id="popup-text"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
