<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем рождения!</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            font-family: 'Comfortaa', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
        }
        .slider-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.6);
        }
        .slider-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .slider-container img.active { display: block; }
        .slide-btn {
            background: #ff4081; color: white; border: none; padding: 12px 24px;
            font-size: 16px; font-family: 'Comfortaa', cursive; font-weight: bold;
            border-radius: 25px; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .slide-btn:hover { background: #e91e63; transform: scale(1.05); }
        .message-box {
            background: rgba(255, 255, 255, 0.3);
            padding: 15px; border-radius: 12px; margin-top: 20px;
            font-size: 15px; line-height: 1.5; color: #4a2832; font-weight: bold;
            min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>С Днем Рождения! 🎉</h1>

        <div class="slider-container">
            <img src="photo1.jpg" class="active" alt="Фото 1">
            <img src="photo2.jpg" alt="Фото 2">
            <img src="photo3.jpg" alt="Фото 3">
            <img src="photo4.jpg" alt="Фото 4">
            <img src="photo5.jpg" alt="Фото 5">
            <img src="photo6.jpg" alt="Фото 6">
            <img src="photo7.jpg" alt="Фото 7">
        </div>

        <button class="slide-btn" id="next-btn">Следующее фото ✨</button>

        <div class="message-box" id="message-text">
            Вы восхитительны! Листайте дальше, чтобы увидеть все моменты ✨
        </div>
    </div>

</body>
</html>
